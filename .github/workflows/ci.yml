name: Arcaday CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  documentation:
    name: Validate project instructions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate AGENTS.md
        shell: bash
        run: |
          set -euo pipefail
          test -s AGENTS.md
          for heading in "## Project" "## Git Workflow" "## Security" "## Quality"; do
            grep -Fxq "$heading" AGENTS.md || exit 1
          done
          echo "AGENTS.md validation passed"

  gameplay:
    name: Validate playable prototype
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
