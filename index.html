<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#eee3cb" />
  <title>Daily Impossible — Arcaday</title>
</head>
<body>
  <main class="game-interface">
    <header><h1>Daily Impossible</h1><p>Évitez les pics et atteignez le drapeau.</p></header>
    <p id="run-status" role="status">Morts : 0</p>
    <div class="game-area">
      <div id="game" aria-label="Terrain de plateforme"></div>
      <section id="result" aria-label="Résultat" hidden>
        <p id="result-text" role="status"></p>
        <button id="replay">Rejouer</button>
      </section>
    </div>
    <nav class="touch-controls" aria-label="Commandes du jeu">
      <button data-action="left" aria-label="Gauche">←</button>
      <button data-action="right" aria-label="Droite">→</button>
      <button data-action="jump" aria-label="Sauter">↑</button>
    </nav>
    <p class="hint">Clavier : ← → ou A/Q/D · Espace/↑ pour sauter</p>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
