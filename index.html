<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#eee3cb" />
  <title>Daily Impossible — Arcaday</title>
</head>
<body>
  <main>
    <header><h1>Daily Impossible</h1><p>Maintenez le saut pour monter plus haut.</p></header>
    <div id="game" aria-label="Terrain de plateforme"></div>
    <nav aria-label="Commandes du jeu">
      <button data-action="left" aria-label="Gauche">←</button>
      <button data-action="right" aria-label="Droite">→</button>
      <button data-action="jump" aria-label="Sauter">Saut</button>
    </nav>
    <p class="hint">Clavier : ← → ou A/Q/D · Espace/↑ pour sauter</p>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
